name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Regenerate derived files
        run: python core/scripts/build.py

      - name: Generated files must be committed and current
        run: |
          git diff --exit-code -- . ':!tests' || {
            echo "::error::Generated files are stale. Run 'python core/scripts/build.py' and commit the result."
            exit 1
          }

      - name: Validate skill structure
        run: python core/scripts/validate.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Examples must audit as documented
        run: |
          python core/scripts/audit.py examples/landing.html --a11y --mobile
          python core/scripts/audit.py examples/audit-after.html --a11y --mobile
          python core/scripts/audit.py examples/a11y-after.html --a11y --mobile
          python core/scripts/audit.py examples/mobile-after.html --a11y --mobile
          ! python core/scripts/audit.py examples/audit-before.html --a11y --mobile
