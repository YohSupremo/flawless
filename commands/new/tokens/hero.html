<!-- Hero skeleton. Names match core/tokens/base.css. No gradients: legibility comes from the flat overlay. -->
<section class="hero">
  <div class="hero-copy">
    <p class="brand">Brand name</p>
    <h1>Plain headline,<br>two lines at most.</h1>
    <p class="lede">One supporting sentence that adds a fact the headline did not.</p>
    <div class="actions">
      <a class="btn btn-primary" href="#primary">Primary action</a>
      <a class="btn btn-secondary" href="#secondary">Second action</a>
    </div>
  </div>
</section>
<style>
.hero { position: relative; min-height: 100svh; display: flex; align-items: center;
  padding: 0 clamp(24px, 5vw, 64px); background: var(--base) url("hero.jpg") right center / cover no-repeat; }
.hero::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.5); } /* delete when there is no photo */
.hero-copy { position: relative; max-width: 560px; }
.brand { margin: 0 0 var(--s4); font: 600 16px var(--font-body); letter-spacing: .04em; text-transform: uppercase; }
h1 { text-wrap: balance; margin: 0 0 var(--s4); font: 400 clamp(56px, 9vw, 112px)/.95 var(--font-display); text-transform: uppercase; }
.lede { margin: 0 0 var(--s5); max-width: 36ch; font: 400 18px/1.55 var(--font-body); color: var(--text-muted); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s3); }
.btn { padding: 16px 32px; border-radius: var(--radius); font: 600 14px var(--font-body); letter-spacing: .04em; text-transform: uppercase; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { border: 1px solid var(--line); color: var(--text); }
@media (max-width: 820px) { .btn { flex: 1 1 100%; text-align: center; } }
</style>
