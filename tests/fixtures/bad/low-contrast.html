<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture</title>
<style>
:root {
  --base: #f1eadd; --surface: #e7dfce; --text: #1f1a15; --text-muted: #cfc6b4; --line: #8a7c68;
  --accent: #b23a14; --accent-ink: #ffffff;
  --font-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px; --s7: 64px; --s8: 96px;
  --radius: 4px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--base); color: var(--text); font: 400 18px/1.55 var(--font-body); }
h1, h2 { text-wrap: balance; }
h1 { margin: 0 0 var(--s4); font: 400 clamp(48px, 9vw, 104px)/.95 var(--font-display); text-transform: uppercase; }
h2 { margin: 0 0 var(--s4); font: 400 clamp(32px, 5vw, 48px)/1 var(--font-display); text-transform: uppercase; }
.hero { min-height: 80svh; display: flex; align-items: center; padding: 0 clamp(24px, 5vw, 64px); }
.hero-copy { max-width: 600px; }
.brand { margin: 0 0 var(--s3); font: 700 16px var(--font-body); letter-spacing: .04em; text-transform: uppercase; }
.lede { margin: 0 0 var(--s5); max-width: 40ch; color: var(--text-muted); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s3); }
.btn { display: inline-block; padding: 16px 32px; border-radius: var(--radius); font: 700 14px var(--font-body); letter-spacing: .04em; text-transform: uppercase; text-decoration: none; transition: opacity 200ms ease; }
.btn:hover { opacity: .85; }
.btn:focus-visible, a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { border: 2px solid var(--text); color: var(--text); }
.hours { background: var(--surface); padding: var(--s8) clamp(24px, 5vw, 64px); }
.hours p { max-width: 48ch; margin: 0 0 var(--s3); }
@media (max-width: 820px) { .hours { padding-top: var(--s6); padding-bottom: var(--s6); } .btn { flex: 1 1 100%; text-align: center; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-copy">
    <p class="brand">Fern Street Books</p>
    <h1>Used books, fairly priced.</h1>
    <p class="lede">A neighborhood shop for every reader.</p>
    <div class="actions">
      <a class="btn btn-primary" href="#visit">Visit the shop</a>
      <a class="btn btn-secondary" href="#hours">See opening hours</a>
    </div>
    
  </div>
</section>
<section class="hours" id="hours">
  <h2>Opening hours</h2>
  <p>Sample content: replace these hours with the shop's real ones before publishing.</p>
</section>
</body>
</html>
